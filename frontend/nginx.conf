# 正式環境：nginx 提供 build 好的靜態檔，/api/* 轉給後端並去掉 /api 前綴，跟開發時 Vite proxy 的規則一樣
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        # proxy_pass 結尾的 / 會把 /api/ 換成 /，等同 Vite 的 rewrite
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # SSE：關掉緩衝，否則 nginx 會把整個回答收完才送出，前端就看不到逐字串流
        proxy_buffering off;
        proxy_cache off;
        # 後端單次 /ask 上限 60 秒，這裡留一點餘裕
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri /index.html;
    }
}
